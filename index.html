<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function guess(){
        const ran=Math.random();
        if(ran<1/3){
            return 'Rock';
        }
        else if(ran<2/3){
            return 'Paper';
        }
        else{
            return 'Scissors';
        }
    }
 function rock(){
        
let computer=guess();
let result = '';

if(computer === 'Rock'){
result = 'Tie';
}
else if(computer === 'Paper'){
result = 'You lose';
}
else{
result = 'You win';
}
document.getElementById("playerchoice").innerHTML = "ROCK";

document.getElementById("computer").innerHTML = computer;

document.getElementById("result1").innerHTML = result;


    }
    function paper(){

let computer= guess();
let result = '';
if(computer === 'Paper'){
result = 'Tie';
}
else if(computer === 'Scissors'){
result = 'You lose';
}
else{
result = 'You win';
}
document.getElementById("playerchoice").innerHTML = "Paper";

document.getElementById("computer").innerHTML = computer;

document.getElementById("result1").innerHTML = result;


    }
    function Scissors(){

let computer = guess();

let result = '';

if(computer === 'Scissors'){
result = 'Tie';
}
else if(computer === 'Rock'){
result = 'You lose';
}
else{
result = 'You win';
}

document.getElementById("playerchoice").innerHTML = "Scissors";

document.getElementById("computer").innerHTML = computer;

document.getElementById("result1").innerHTML = result;
     }
</script>

<style>
    #body1{
        display:inline;
        justify-content: center;
        align-items:center;
    
    }
    #body1 span{
        margin-right:10px;
    
    
    }
    footer{
        margin-top:30px;
        text-align: center;
        
    }
    footer  div {
        display: inline-block;
        text-align:left;
    }
    footer div p{
    
    }
    button:hover{
        background-color: #212529 !important;
        color:white !important;
          transform: rotate(5deg);
    

    }
    
</style>
</head>

<body>
<div class="text-center mt-3">
<h1 class="text-primary"><b>Rock Paper Scissors</b></h1>
</div>
<div class="container fluid  d-flex justify-content-center align-items-center" style="display:inline" >
<diV id="body1" class="card shadow p-5 mt-5" style="width:350px">
<span  >
<button   class="btn btn-warning " onclick="rock()"  data-bs-target="#main1" data-bs-toggle="modal">Rock</button>
</span>
<span>
<button  class= " btn btn-primary"onclick="paper()" data-bs-target="#main1" data-bs-toggle="modal">Paper</button>
</span>
<span>
<button class="btn btn-success" onclick="Scissors()" data-bs-target="#main1" data-bs-toggle="modal">Scissors</button>
</span>
</diV>
</div>
<div class="modal" id="main1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="text-center"> Game Result</h5>
                <button  data-bs-dismiss="modal"class="btn-close"></button>
            </div>
        
                <div class="modal-body text-center">

    <h4>You picked: <span   class="text-primary" id="playerchoice"></span></h4>

    <h4>Computer picked: <span class=" text-warning" id="computer"></span></h4>

    <h3  class="text-center text-danger" id="result1"></h3>

   </div>
     <div class="modal-footer">
<button  class="btn btn-success w-30 p-1"  data-bs-dismiss="modal" >okay</button>
    </div>
   </div>  
   </div>
   </div>


 <h2 class="text-primary mt-3"><marquee>Instructions</marquee></h2>
<footer>
<div >
    
<h3 class="text-center"><b>How to Play</b></h3>
<div  class="text-start text-center  ">
<p>1. Choose Rock, Paper, or Scissors.</p>
<p>2. The computer will randomly choose one.</p>
<p>3. Rock beats Scissors.</p>
<p>4. Scissors beats Paper.</p>
<p>5. Paper beats Rock.</p>
<p>6. If both choose the same option, it is a Draw.</p>
</div>
</div>
</footer>
</body>
</html>
